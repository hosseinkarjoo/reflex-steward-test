# Steward Architecture Check — auto-generated by `steward generate-action`
# Edit options and re-run to regenerate, or modify this file directly.
#
# Expected timing per PR:
#   Build analysis index:  ~15s  (steward rebuild --analysis-only)
#   Compute changed files: ~2s
#   Architecture check:    ~5–10s
#   Post comment + status: ~5s
#   Claude API call:       ~3s   (Tier 1 only, ~10% of PRs)
#   Total:                 ~30–40s (deterministic) / ~45s (with AI)
#
# Token cost: ≤1,500 input tokens per call · ≤$0.05 per PR worst case.
name: Steward Architecture Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  steward:
    name: Architecture Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Steward
        env:
          steward_token: ${{ secrets.steward_token }}
        run: |
          pip install --no-cache-dir "steward[ai] @ git+https://${steward_token}@github.com/karjoo-devs/steward.git@main"

      - name: Set pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state=pending \
            -f description="Steward is analysing…" \
            -f context=steward/review

      - name: Validate index integrity
        run: steward validate --ci
        # Checks committed steward_out/ artifacts are intact before rebuild touches them.
        # Fails if any artifact is missing, corrupt, or tampered with.

      - name: Build analysis index
        id: rebuild
        run: steward rebuild --analysis-only
        # Incremental update on top of committed steward_out/ (~5s).
        # For coverage data: run steward rebuild on a separate schedule.

      - name: Compute changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.py$' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Write PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/steward-pr-body.txt

      - name: Run architecture check
        id: steward_check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          steward pr-check \
            --files ${{ steps.changed.outputs.files }} \
            --pr ${{ github.event.pull_request.number }} \
            --description-file /tmp/steward-pr-body.txt \
            --full-review \
<<<<<<< Updated upstream
=======
            --deep \
>>>>>>> Stashed changes
            --no-refresh \
            --format json > /tmp/steward-findings.json
        continue-on-error: true

      - name: Post PR review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          steward pr-post-review \
            --input /tmp/steward-findings.json \
            --pr ${{ github.event.pull_request.number }}
        continue-on-error: true
      - name: Post inline diff comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          steward post-inline \
            --pr ${{ github.event.pull_request.number }} \
            --input /tmp/steward-findings.json \
            --sha ${{ github.event.pull_request.head.sha }}
        continue-on-error: true
      - name: Apply override directives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          steward apply-overrides \
            --pr ${{ github.event.pull_request.number }} \
            --input /tmp/steward-findings.json \
            --body-file /tmp/steward-pr-body.txt
        continue-on-error: true
      - name: Generate full analysis report
        if: steps.steward_check.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          steward pr-report \
            --input /tmp/steward-findings.json \
            --pr ${{ github.event.pull_request.number }}
        continue-on-error: true
      - name: Post re-review delta reply
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          steward delta-reply \
            --pr ${{ github.event.pull_request.number }} \
            --new-findings /tmp/steward-findings.json \
            --sha ${{ github.event.pull_request.head.sha }}
        continue-on-error: true
      - name: Enforce gate result
        run: |
          python - <<'EOF'
          import json, sys
          f = json.load(open('/tmp/steward-findings.json'))
          gr = f.get('gate_result', 'pass')
          n  = len(f.get('violations', []))
          print(f"gate={gr}  violations={n}")
          if gr == 'hard_block':
              sys.exit(1)
          EOF
      - name: Set final commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, subprocess, sys, os
          try:
              f = json.load(open('/tmp/steward-findings.json'))
              gr = f.get('gate_result', 'pass')
              n  = len(f.get('violations', []))
              # advisory — always green; Steward comments, never blocks merge
              state = 'pass'
              desc  = f'Steward review complete ({n} violation(s) — advisory)'
          except Exception:
              state = 'error'
              desc  = 'Steward analysis error'
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          sha = os.environ.get('GITHUB_SHA', '')
          subprocess.run([
              'gh', 'api', 'repos/' + repo + '/statuses/' + sha,
              '-f', 'state=' + state,
              '-f', 'description=' + desc,
              '-f', 'context=steward/review',
          ])
          EOF